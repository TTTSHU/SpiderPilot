<!DOCTYPE html>
<html lang=zh>
<head>
<meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Settings - SpiderPilot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SF Pro Display",system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;color:#58a6ff;font-weight:600}
.header a{color:#8b949e;text-decoration:none;font-size:13px}
.container{max-width:640px;margin:0 auto;padding:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;color:#e6edf3;margin-bottom:12px}
.form-group{margin-bottom:12px}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px;font-weight:500}
input,select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;color:#c9d1d9;font-size:14px;font-family:monospace}
input:focus,select:focus{outline:none;border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #30363d;background:#21262d;color:#c9d1d9;text-decoration:none}
.btn:hover{background:#30363d}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.hint{font-size:12px;color:#8b949e;margin-top:4px}
.success{background:#23863622;color:#3fb950;border:1px solid #23863644;padding:12px;border-radius:6px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>
<div class=header>
  <a href=/>Home</a>
  <h1>Settings</h1>
  <span>LLM API Configuration</span>
</div>
<div class=container>
  <div class=card>
    <h2>API Configuration</h2>
    <form method=post action=/settings>
      <div class=form-group>
        <label>API Key</label>
        <input name=api_key value="{{ cfg.api_key }}" type=password placeholder="sk-xxx">
        <div class=hint>Your OpenAI-compatible API key. Stored locally in ~/.spiderpilot_config.json</div>
      </div>
      <div class=form-group>
        <label>API Base URL</label>
        <input name=api_base value="{{ cfg.api_base }}" placeholder="https://api.deepseek.com/v1">
        <div class=hint>OpenAI-compatible endpoint. Examples: https://api.openai.com/v1, https://api.deepseek.com/v1</div>
      </div>
      <div class=form-group>
        <label>Model</label>
        <input name=model value="{{ cfg.model }}" placeholder="deepseek-v4-flash">
        <div class=hint>Model name to use for reverse analysis, code generation, and repair.</div>
      </div>
      <button type=submit class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
</body>
</html>
