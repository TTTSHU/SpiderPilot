<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpiderPilot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: #666; margin-bottom: 32px; }

.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card h2 { font-size: 18px; margin-bottom: 16px; }

form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 13px; color: #666; }
input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 200px; }
input:focus { outline: none; border-color: #4f46e5; }

.btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
.btn-primary { background: #4f46e5; color: #fff; }
.btn-primary:hover { background: #4338ca; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 14px; }
th { color: #666; font-weight: 500; }
tr:hover { background: #fafafa; }
a { color: #4f46e5; text-decoration: none; }
a:hover { text-decoration: underline; }

.status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.status-created { background: #e5e7eb; color: #6b7280; }
.status-probing { background: #fef3c7; color: #92400e; }
.status-waiting_ai { background: #fef3c7; color: #92400e; animation: pulse 1.5s infinite; }
.status-analyzed { background: #dbeafe; color: #1e40af; }
.status-generated { background: #d1fae5; color: #065f46; }
.status-complete { background: #d1fae5; color: #065f46; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

.empty { text-align: center; padding: 40px; color: #999; }
.empty p { margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
    <h1>🕷️ SpiderPilot</h1>
    <p class="subtitle">输入 URL，让 AI 自动分析并生成爬虫代码</p>
<div id="agent-banner" style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:12px 16px;margin-bottom:24px;font-size:13px;color:#3730a3;">
  🔍 扫描本地 AI 工具...
</div>

    <div class="card">
        <h2>➕ 新建任务</h2>
        <form action="/create" method="post">
            <div class="form-group">
                <label>任务名称</label>
                <input name="name" placeholder="如: empik" required>
            </div>
            <div class="form-group">
                <label>平台域名（可选）</label>
                <input name="platform" placeholder="如: empik.com">
            </div>
            <div class="form-group">
                <label>目标 URL</label>
                <input name="url" placeholder="https://..." required style="width:400px">
            </div>
            <div class="form-group" style="width:100%">
                <label>AI 工具</label>
                <div id="agent-selector" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
                    <span style="color:#888;font-size:13px">扫描中...</span>
                </div>
                <input type="hidden" name="agent" id="agent-input" value="">
            </div>
            <button class="btn btn-primary" type="submit" id="submit-btn" disabled>创建</button>
        </form>
    </div>

    <div class="card">
        <h2>📋 任务列表</h2>
        {% if projects %}
        <table>
            <thead>
                <tr>
                    <th>任务</th>
                    <th>URL</th>
                    <th>状态</th>
                    <th>字段</th>
                    <th>更新时间</th>
                </tr>
            </thead>
            <tbody>
            {% for p in projects %}
                <tr>
                    <td><a href="/task/{{ p.name }}">{{ p.name }}</a></td>
                    <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ p.url }}</td>
                    <td><span class="status status-{{ p.status }}">{{ p.status }}</span></td>
                    <td>{{ p.fields_count }}</td>
                    <td>{{ p.updated }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">
            <p>暂无任务</p>
            <p>👆 上方创建一个</p>
        </div>
        {% endif %}
    </div>
</div>
<script>
var agentsData = [];
fetch('/api/agents').then(r=>r.json()).then(agents=>{
  agentsData = agents;
  // 顶部 banner
  var el=document.getElementById('agent-banner');
  if(!agents.length){el.innerHTML='<strong>未检测到 AI 工具</strong> — 请安装 <a href="https://codewhale.ai" target="_blank" style="color:#4f46e5">CodeWhale</a>';}
  else {el.innerHTML='<strong>已检测到 '+agents.length+' 个 AI 工具</strong>';}

  // 表单选择按钮
  var list=document.getElementById('agent-selector');
  if(!list || !agents.length) return;
  list.innerHTML='';
  agents.forEach(function(a,i){
    var btn=document.createElement('button');
    btn.type='button';
    btn.style.cssText='padding:6px 14px;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;transition:all .15s';
    btn.innerHTML=a.icon+' '+a.name;
    btn.title=a.description;
    btn.onclick=function(){
      document.querySelectorAll('#agent-selector button').forEach(function(b){b.style.borderColor='#ddd';b.style.background='#fff'});
      btn.style.borderColor='#4f46e5';btn.style.background='#eef2ff';
      document.getElementById('agent-input').value=a.id;
      document.getElementById('submit-btn').disabled=false;
    };
    list.appendChild(btn);
    if(i===0) btn.onclick();
  });
});
</script>
</body>
</html>
