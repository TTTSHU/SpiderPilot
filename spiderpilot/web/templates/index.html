<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpiderPilot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;color:#58a6ff;font-weight:600}
.header span{color:#8b949e;font-size:13px}
.container{max-width:960px;margin:0 auto;padding:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;color:#e6edf3;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px;font-weight:500}
input,textarea,select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;color:#c9d1d9;font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
textarea{resize:vertical;min-height:100px;line-height:1.5;font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #30363d;transition:all .15s}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-secondary{background:#21262d;color:#c9d1d9}
.btn-secondary:hover{background:#30363d}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:#da3633;border-color:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0d1117;border:1px solid #30363d;border-radius:6px;cursor:pointer;transition:all .12s;text-decoration:none;color:inherit}
.task-item:hover{background:#161b22;border-color:#58a6ff}
.task-item .name{font-weight:600;color:#58a6ff;font-size:14px}
.task-item .meta{color:#8b949e;font-size:12px;display:flex;gap:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.badge-ok{background:#23863622;color:#3fb950;border:1px solid #23863644}
.badge-fail{background:#da363322;color:#f85149;border:1px solid #da363344}
.field-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.field-row input{flex:1}
.field-row select{width:120px}
.field-row .btn{flex-shrink:0}
.hint{font-size:12px;color:#8b949e;margin-top:4px;line-height:1.5}
.empty{text-align:center;color:#8b949e;padding:32px;font-size:14px}
.row{display:flex;gap:12px}
.col{flex:1}
pre{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;max-height:300px}
</style>
</head>
<body>
<div class="header"><a href="/settings" style="color:#8b949e;text-decoration:none;font-size:13px;margin-right:12px">Settings</a>
  <h1>SpiderPilot</h1>
  <span>AI 自动逆向爬虫框架</span>
</div>
<div class="container">
  <div class="card">
    <h2>新建任务</h2>
    <form method="post" action="/create" id="create-form">
      <div class="row">
        <div class="col">
          <div class="form-group">
            <label>任务名称</label>
            <input name="name" placeholder="my_product_detail" required>
          </div>
        </div>
        <div class="col">
          <div class="form-group">
            <label>行业模板</label>
            <select name="template">
              <option value="generic">通用</option>
              <option value="ecommerce">电商</option>
              <option value="news">新闻</option>
              <option value="jobs">招聘</option>
              <option value="real_estate">房产</option>
              <option value="social_media">社媒</option>
            </select>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>样例 URL</label>
        <textarea name="urls" placeholder="https://example.com/product/1001|title=Apple iPhone 15|price=3999&#10;https://example.com/product/1002|title=Samsung S24|price=4599&#10;https://example.com/product/1003|title=Xiaomi 14|price=5299" required></textarea>
        <div class="hint">每行一个 URL + 期望字段：<code>URL|字段名=期望值|字段名=期望值</code></div>
      </div>
      <div class="form-group">
        <label>字段定义</label>
        <div id="fields-container">
          <div class="field-row">
            <input placeholder="字段名" class="field-name" value="title">
            <select class="field-type"><option>string</option><option>decimal</option><option>int</option><option>list[string]</option><option>html</option><option>datetime</option></select>
            <select class="field-req"><option value="1">必填</option><option value="0">可选</option></select>
          </div>
          <div class="field-row">
            <input placeholder="字段名" class="field-name" value="price">
            <select class="field-type"><option>string</option><option selected>decimal</option><option>int</option></select>
            <select class="field-req"><option value="1">必填</option></select>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addField()" style="margin-top:6px">+ 添加字段</button>
      </div>
      <input type="hidden" name="fields_data" id="fields-json">
      <button type="submit" class="btn btn-primary" onclick="prepareFields()">创建任务</button>
    </form>
  </div>

  <div class="card">
    <h2>已有任务</h2>
    {% if tasks %}
    <div class="task-list">
    {% for t in tasks %}
      <a href="/task/{{ t.task_id }}" class="task-item">
        <span class="name">{{ t.task_id }}</span>
        <span class="meta">{{ t.samples }} 个样本 · {{ t.fields|length }} 个字段</span>
      </a>
    {% endfor %}
    </div>
    {% else %}
    <div class="empty">还没有任务，在上面新建一个</div>
    {% endif %}
  </div>
</div>
<script>
function addField(){
  var d=document.createElement("div");
  d.className="field-row";
  d.innerHTML='<input placeholder="字段名" class="field-name"><select class="field-type"><option>string</option><option>decimal</option><option>int</option><option>list[string]</option><option>html</option><option>datetime</option></select><select class="field-req"><option value="1">必填</option><option value="0">可选</option></select><button type="button" class="btn btn-sm" style="color:#f85149;border:none;background:none" onclick="this.parentElement.remove()">×</button>';
  document.getElementById("fields-container").appendChild(d)
}
function prepareFields(){
  var rows=document.querySelectorAll(".field-row");
  var fields=[];
  rows.forEach(function(r){
    var name=r.querySelector(".field-name").value.trim();
    if(!name) return;
    fields.push({name:name,type:r.querySelector(".field-type").value,required:r.querySelector(".field-req").value==="1"})
  });
  document.getElementById("fields-json").value=JSON.stringify(fields)
}
</script>
</body>
</html>
