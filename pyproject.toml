[project]
name = "spiderpilot"
version = "0.1.0"
description = "AI-powered field-driven reverse crawling framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0.0",
  "websocket-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
spiderpilot = "spiderpilot.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spiderpilot*"]
exclude = ["workspace*", "tests*"]
